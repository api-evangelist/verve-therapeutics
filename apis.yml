name: Verve Therapeutics
description: 'Verve Therapeutics is a Boston-based clinical-stage biotechnology company
  developing a pipeline of in vivo gene editing medicines designed to treat cardiovascular
  disease with a single, one-time treatment. Its programs use base editing and CRISPR
  technology to durably switch off disease-driving genes, led by VERVE-102 (targeting
  PCSK9 to lower LDL cholesterol), alongside VERVE-201 (ANGPTL3) and VERVE-301 (LPA).
  Verve was acquired by Eli Lilly in July 2025 in a deal worth up to $1.3 billion.
  As a therapeutics/research company it publishes no public developer API; this profile
  is maintained as a company identity record in the API Evangelist network. Originally
  surfaced as a portfolio company of GV.'
